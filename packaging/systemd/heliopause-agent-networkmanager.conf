# Opt-in ONLY for networkmanager-wireguard-1.56-v1 on the measured NM 1.56.0.
# Install alongside heliopause-agent-network.conf. Do not enable the legacy writer unit.
[Unit]
# Ordering is not connectivity readiness. Driver operations still refuse unavailable NM.
# Wants keeps firewall startup/recovery available even if NM fails to start.
Wants=NetworkManager.service
After=NetworkManager.service

[Service]
# NM stores the copied WG private key here as a root-owned 0600 keyfile.
# Profile paths are derived from signed UUIDs; arbitrary profile paths are never accepted.
ReadWritePaths=/etc/NetworkManager/system-connections
