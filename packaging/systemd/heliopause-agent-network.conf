# Install under heliopause-agent.service.d/ only when enabling integrated network execution.
# Preserve an existing custom state/locator path; change this allowlist explicitly if needed.
[Service]
Environment=HELIOPAUSE_NETWORK_EXECUTOR=1
ReadWritePaths=/var/lib/heliopause/network-executor
# Existing ownership/0700 provisioning is explicit; do not chmod the shared relay parent.
# Graceful stop retains the writer lock while bounded network apply/undo completes.
TimeoutStopSec=130s
