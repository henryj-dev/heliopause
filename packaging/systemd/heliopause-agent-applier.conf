[Service]
# Reset the non-applier visibility list, then keep both common cluster-admin credentials hidden.
# The dedicated kubeconfig is visible through ProtectSystem=strict and made explicit/read-only here.
InaccessiblePaths=
InaccessiblePaths=-/etc/rancher/k3s/k3s.yaml -/etc/kubernetes/admin.conf
ReadOnlyPaths=/etc/heliopause/kubeconfig
