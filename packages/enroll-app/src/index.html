<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heliopause Enroll</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">Heliopause Enroll</h1>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
    </header>

    <main class="app-main">
      <div class="toolbar">
        <button id="refresh-btn" class="btn">Refresh</button>
        <span id="list-status" class="list-status"></span>
      </div>
      <section id="cards" class="cards"></section>
    </main>

    <!-- Settings modal -->
    <div id="settings-overlay" class="overlay hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
        <h2 id="settings-heading">Settings</h2>
        <div class="field">
          <label for="cfg-binDir">Bin dir (cwd)</label>
          <input id="cfg-binDir" type="text" spellcheck="false" />
        </div>
        <div class="field">
          <label for="cfg-managerUrl">Manager URL</label>
          <input id="cfg-managerUrl" type="text" spellcheck="false" />
        </div>
        <div class="field">
          <label for="cfg-pkiDir">PKI dir</label>
          <input id="cfg-pkiDir" type="text" spellcheck="false" />
        </div>
        <div class="field">
          <label for="cfg-operator">Operator</label>
          <input id="cfg-operator" type="text" spellcheck="false" />
        </div>
        <div class="field">
          <label for="cfg-caName">CA name</label>
          <input id="cfg-caName" type="text" spellcheck="false" />
        </div>
        <div class="field">
          <label for="cfg-nodePath">Node path</label>
          <input id="cfg-nodePath" type="text" spellcheck="false" />
        </div>
        <div id="settings-status" class="settings-status"></div>
        <div class="modal-actions">
          <button id="settings-cancel" class="btn btn-ghost">Cancel</button>
          <button id="settings-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
