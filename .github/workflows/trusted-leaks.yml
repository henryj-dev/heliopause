# Security boundary: `pull_request_target` loads this workflow from the default branch, never from
# the candidate commit. It may inspect candidate Git objects but must never execute candidate code,
# Actions, hooks, package scripts, or configuration.
name: trusted site-data leak gate

# `zizmor: ignore[dangerous-triggers]` — `pull_request_target` is flagged because it is almost always
# used to run candidate code with a repository token. That is precisely what the block comment above
# forbids and what the `sparse-checkout` of a path that matches nothing enforces: the candidate is
# fetched as inert Git objects and the only code executed is the scanner checked out from the
# protected default branch. This trigger is the whole point of the file, so the suppression is a
# statement about this workflow, not a silenced rule.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: trusted site-data leak gate
    # Hosted, like every job in `ci.yml`. This one had a self-hosted label hardcoded while `ci.yml`
    # was routing fork pull requests away from that machine, so `pull_request_target` — which fires
    # for **every** fork pull request — reopened the half that file had closed. Both workflows now
    # run on ephemeral VMs and the question does not arise; this job reads Git objects and runs
    # Node, and never needed a particular machine.
    runs-on: ubuntu-latest
    # This is the required merge gate, so a hang here is not merely a bill — it is a pull request
    # that can never go green. A bounded failure is reviewable; an indefinite pending one is not.
    timeout-minutes: 20
    steps:
      - name: checkout trusted scanner from the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-scanner
          persist-credentials: false
          # 🔴 **The allowlist comes from here, not from the candidate.** It is read by path, and
          # this job runs the scanner with the *candidate's* checkout as the working directory. If
          # the allowlist were taken from there, a pull request could ship a leak and accept it in
          # the same commit — the trusted-scanner arrangement would be intact and useless.
          sparse-checkout: |
            scripts/scan-public-history.mjs
            .heliopause-scanignore
          sparse-checkout-cone-mode: false

      # GitHub publishes every PR head (including a fork) under the base repository's refs/pull
      # namespace. Fetching that ref from the base repository with full history keeps both SCAN_BASE
      # and SCAN_HEAD in one object database, including conflicted PRs that have no /merge ref.
      #
      # Sparse checkout deliberately matches no candidate path: the scanner reads trees and blobs
      # with ls-tree + cat-file, so no candidate filename or file needs to be materialized.
      #
      # **`filter` is why this works at all.** Setting `sparse-checkout` makes `actions/checkout`
      # fetch with `--filter=blob:none`, and a blobless clone has no blobs to scan — the first
      # `git cat-file blob` reaches for the network instead, finds the credentials this job
      # deliberately does not keep, and dies with `could not read Username for
      # 'https://github.com'`. Measured, on the first run that ever got past the missing
      # `HELIOPAUSE_SITE_HOSTNAME_PATTERN`: this gate could not read a single byte it was created to
      # read. `blob:limit=1g` keeps the checkout partial in form while fetching every blob that
      # matters, so the scan runs entirely against local objects and needs no network.
      - name: fetch pull-request objects as inert data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: .candidate
          fetch-depth: 0
          persist-credentials: false
          filter: blob:limit=1g
          sparse-checkout: .heliopause-no-candidate-files
          sparse-checkout-cone-mode: false

      - name: fetch default-branch objects for scheduled scan
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: .candidate
          fetch-depth: 0
          persist-credentials: false
          filter: blob:limit=1g
          sparse-checkout: .heliopause-no-candidate-files
          sparse-checkout-cone-mode: false

      # Two assumptions above, both cheap to check and both silent when wrong.
      #
      # `filter` and `sparse-checkout` are documented as interacting, so the working tree could come
      # back holding candidate files instead of nothing. And a scan that reads no blob passes: the
      # gate's green is indistinguishable from an empty object database, which is exactly how the
      # blobless clone above went unnoticed until the credential error made it loud.
      - name: the checkout materialised no candidate file, and the blobs are local
        working-directory: .candidate
        run: |
          set -euo pipefail
          # shellcheck disable=SC2012  # `find` over `ls` is about filenames containing newlines.
          # Here that miscount can only go one way — a newline splits one entry into two, raising
          # the count — and this test fails on any count above zero. A hostile filename makes the
          # gate stricter, never laxer, which is the direction this check has to be wrong in.
          entries="$(ls -A . | { grep -vx '.git' || true; } | wc -l | tr -d ' ')"
          test "$entries" = "0" \
            || { echo "checkout materialised $entries candidate entr(y|ies) into the workspace"; exit 1; }
          # `--missing=print` reports a promisor object instead of fetching it, so this counts what
          # is absent without becoming the very network call the scan must not make.
          missing="$(git rev-list --objects --all --missing=print | { grep -c '^?' || true; })"
          test "$missing" = "0" \
            || { echo "$missing object(s) absent locally — the scan would read nothing"; exit 1; }
          echo "workspace entries: 0 · missing objects: 0 · paths in HEAD: $(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: scan pull-request Git objects with protected code
        if: github.event_name == 'pull_request_target'
        working-directory: .candidate
        env:
          # This value never enters a command line or output. Findings expose only a hashed source
          # label and a finding class, never the matching hostname, blob contents, or candidate path.
          HELIOPAUSE_SITE_HOSTNAME_PATTERN: ${{ secrets.HELIOPAUSE_SITE_HOSTNAME_PATTERN }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          node "$GITHUB_WORKSPACE/.trusted-scanner/scripts/scan-public-history.mjs"
          --base "$SCAN_BASE" --head "$SCAN_HEAD" --require-hostname-pattern
          --ignore-file "$GITHUB_WORKSPACE/.trusted-scanner/.heliopause-scanignore"

      - name: scan all reachable default-branch history
        if: github.event_name != 'pull_request_target'
        working-directory: .candidate
        env:
          HELIOPAUSE_SITE_HOSTNAME_PATTERN: ${{ secrets.HELIOPAUSE_SITE_HOSTNAME_PATTERN }}
        run: >-
          node "$GITHUB_WORKSPACE/.trusted-scanner/scripts/scan-public-history.mjs"
          --all --require-hostname-pattern
          --ignore-file "$GITHUB_WORKSPACE/.trusted-scanner/.heliopause-scanignore"
