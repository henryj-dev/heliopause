# What CI is for here: the checks that catch a firewall behaving differently than its plan says.
#
# The suites are split by what they need, not by speed. `test` and `typecheck` are pure and run
# everywhere; `e2e` needs a real TLS handshake because identity binding cannot be unit-tested; and
# `rollback` needs a real kernel because the thing under test is whether nftables actually reverts.
# Collapsing them into one job would mean a machine without `nft` silently skipping the check that
# matters most.
#
# Two jobs here are about the repository rather than the product, and they are not decoration.
# `leaks` is the backstop half of the site-data scan (the authoritative half is `trusted-leaks.yml`),
# and `guards` runs the hook suites that keep agent sessions off the shared working tree. Both guard
# against failures whose symptom is silence, which is the only reason a check is worth CI minutes.
name: ci

on:
  # `main` only, not `["**"]`. A branch here is either on its way to a pull request — where
  # `pull_request` runs these same jobs against the merge result, which is the verdict that actually
  # decides the merge — or an agent worktree branch that gets rebased and pushed straight to `main`,
  # which this still covers. The wildcard bought a second full run of `e2e` and `rollback` for the
  # first case and nothing for the second, and on a public repository those minutes are shared with
  # every contributor's pull requests.
  push:
    branches: [main]
  pull_request:
  # A firewall tool's dependencies are few but its assumptions about the host are many — a kernel or
  # nft change can break the rollback path without anything in this repository moving.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# ── Every job runs on a GitHub-hosted runner ─────────────────────────────────
#
# This workflow used to split by whether the pull request came from a fork, because two jobs ran on
# a self-hosted machine of ours: a fork's `pull_request` runs the **candidate's** code, `npm ci`
# executes lifecycle scripts from the branch's own package.json, and `rollback-test.sh` starts a
# container with `--pid=host --cap-add=NET_ADMIN` — a container-escape primitive one step from the
# machine that builds the firewall control plane. The split also had to be written out at each job,
# because `runs-on` is evaluated before a job's environment exists and a variable there resolves to
# empty, landing every job on the self-hosted runner while looking correct.
#
# All of that was the price of the self-hosted runner, and this repository no longer pays it. A
# GitHub-hosted runner is an ephemeral VM discarded after one job, so a candidate's code has nothing
# to persist into and nothing of ours to reach. That is also what lets `e2e` and `rollback` run for
# a fork at all: they were skipped there, which meant the two checks with the strongest claim —
# a real handshake and a real kernel — were exactly the ones an outside contribution never got.
#
# What this does not decide: `pull_request` still requires approval before it runs for an outside
# contributor, and that setting belongs in the repository, not here. The default ("first-time
# contributors") is the right floor now that no job touches our own hardware.
#
# `rollback` needs a real kernel and NET_ADMIN. A hosted Ubuntu runner is a full VM with root and
# Docker, so it has both — the job's requirement was never the *specific* machine.

jobs:
  check:
    name: types, unit tests, agent tests
    runs-on: ubuntu-latest
    # A hung job on a public repository does not fail — it bills. Without a ceiling the default is
    # six hours, which is the difference between a bad commit costing minutes and costing a day of
    # the account's shared budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, so nothing needs the token left in `.git/config` afterwards. What it
          # would buy an attacker is not theoretical: `npm ci` runs lifecycle scripts from the
          # branch's own package.json, and on a fork's pull request that is candidate code running
          # in a checkout that holds a credential.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Type stripping runs .ts directly, so the Node version is the toolchain. 22 is the floor
          # the code assumes; testing on it rather than on latest keeps that claim honest.
          node-version: "22"
          # Keyed on package-lock.json, which is what `npm ci` reads. The workspaces have no lock of
          # their own — the root one covers all seven — so one key is the whole dependency set.
          cache: npm
      - run: npm ci
      # Covers `src/` + `bin/` + `examples/`, and then `@heliopause/manager`, which has its own
      # tsconfig and was checked by nothing — the root script only ran the root project, so the
      # workspace's `typecheck` script existed and no gate called it. `examples/` was outside the
      # root `include` for the same reason and had shipped a real error: `node --test` runs those
      # files by stripping types, never by checking them.
      - run: npm run typecheck
      # Svelte's template and component diagnostics are outside the root tsconfig.
      # Keep this as a named gate so a passing library typecheck cannot hide a
      # broken operator console.
      - run: npm run check:web
      # `check:web` type-checks the console; it does not prove the console still *builds*. The
      # manager and the workstation both serve this build's output, so a broken adapter or a bad
      # import lands as a firewall console that will not come up — on the day the network is broken,
      # which is the day it gets opened. Five seconds of CI, measured.
      - run: npm run build:web
      # The console renders icons from a generated source file, deliberately, so that a firewall
      # console loads nothing from a CDN. Lucide renames icons between versions and a name that no
      # longer exists renders as an **empty box**, not an error — the same silence this repository
      # keeps getting caught by. `--check` is the only thing that turns it into a failure.
      - run: npm run icons:check
      # `npm test` is now `scripts/run-tests.sh`: it runs every suite and *then* reports, rather
      # than `a && b && c`. The old chain stopped at the first failure, and because `policy/` is an
      # untracked symlink into another clone, the common local failure was two tests from that
      # clone — after which `@heliopause/manager` and `@heliopause/web` never ran at all. CI never
      # saw it (no `policy/` in a clean checkout), which is the worst place for a difference
      # between what CI runs and what a person runs to live.
      #
      # It also runs the agent's Python suites, so this one step is the whole test surface.
      - run: npm test
      # A workspace can declare a `test` script that nothing calls — `@heliopause/agent` did, for
      # months, while CI invoked the same files by another route. Harmless there, invisible in
      # general: a suite nobody runs looks exactly like coverage.
      - run: ./scripts/check-workspace-suites.sh

  e2e:
    name: mTLS round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Identity binding depends on a real handshake presenting a real client certificate. The whole
      # security argument for staged rollout rests on it: if the relay cannot tell which agent is
      # calling, any host with a certificate can report as the canary and open the gate.
      - run: ./scripts/e2e-roundtrip.sh

  rollback:
    name: auto-rollback against a real kernel
    # The strongest capability any job here holds: a container with `--pid=host` and NET_ADMIN. On
    # an ephemeral hosted VM that is a capability over a machine discarded when the job ends.
    runs-on: ubuntu-latest
    # The rollback timer this exercises is measured in seconds, not minutes. If the job is still
    # alive after fifteen, the thing under test did not happen and no longer will.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No `npm ci` and no cache: the relay and the agent import only `src/`, so this job needs
          # the interpreter and nothing from the registry. `package-manager-cache: false` is what
          # makes the second half of that true — setup-node v7 turns caching on by itself when
          # package.json declares a `packageManager`, so leaving the input off would make this
          # comment depend on a field in another file that nobody would connect to it.
          node-version: "22"
          package-manager-cache: false
      # The property under test is that a locking ruleset is actually reverted by the agent's timer.
      # A mock cannot fail the way a kernel does, and this is the check that stands between a bad
      # generation and a host nobody can reach.
      - run: ./scripts/rollback-test.sh

  # gitleaks moved to the shared policy layer (the `policy` job below). What stays here is
  # the axis only this repository has: the site-inventory scanner, which knows what a *site*
  # looks like and cannot be shared with repositories that have no sites.
  leaks:
    name: defense-in-depth leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both scanners need commit objects, not only the checked-out HEAD. The custom scanner
          # inspects every introduced commit so "add secret, delete it later" is still caught.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # ⚠️ **This job reads the candidate's `.heliopause-scanignore`**, because its checkout *is*
      # the candidate. A fork could therefore accept its own finding here — and that is the
      # designed layering, not an oversight: this is the backstop half, and it runs without the
      # hostname secret for the same reason. The authoritative half is `trusted-leaks.yml`, which
      # passes `--ignore-file` pointing into a checkout of the protected default branch, so an
      # allowlist entry only ever takes effect once it is merged and reviewed.
      - name: scan every introduced commit for site data
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          node scripts/scan-public-history.mjs
          --base "$SCAN_BASE" --head "$SCAN_HEAD" --default-branch "$DEFAULT_BRANCH"

  guards:
    name: agent worktree guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `test-session-end-cleanup.py` asks which worktree branches a session may delete, and
          # "already merged" is a history question. A shallow checkout answers it wrongly rather
          # than refusing to answer.
          fetch-depth: 0
          persist-credentials: false

      # `git clone` writes `refs/remotes/origin/HEAD`; `actions/checkout` does not — it builds the
      # repository with `init` + `fetch`, and nothing in that path sets a remote HEAD. The suites
      # create their worktrees off `origin/HEAD`, so without this the whole file dies at the first
      # fixture with `fatal: invalid reference: origin/HEAD` — measured against a checkout built the
      # way the runner builds one. It fails loudly if the ref is missing, which is the point: a
      # skipped guard suite and a passing one must not look alike.
      - name: point origin/HEAD at the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/$DEFAULT_BRANCH"

      # These hooks are what keeps several agent sessions from sharing one index and committing each
      # other's half-finished work (AGENTS.md). They are tracked code with tests, and until now
      # nothing ran those tests except a person remembering to — which is the worst shape for this
      # particular thing: **a guard that has stopped denying looks exactly like a guard that works.**
      # Every suite here pins the ALLOW side too, and mutates a copy of the hook to prove the check
      # is not vacuous, so a green run means more than "nothing threw".
      #
      # Standard library only, no install step, ~20s for all seven. They build their own fixtures in
      # temporary directories and restore the owner records they touch.
      - name: hook suites
        run: |
          set -euo pipefail
          python3 scripts/claude-hooks/test-main-tree-guard.py
          python3 scripts/claude-hooks/test-enter-worktree.py
          python3 scripts/claude-hooks/test-ignored-paths.py
          python3 scripts/claude-hooks/test-session-start-pull.py
          python3 scripts/claude-hooks/test-session-end-cleanup.py
          python3 scripts/claude-hooks/test-codex-hooks.py
          python3 scripts/git-hooks/test-pre-commit.py

  # The desktop enrolment app: Rust + a plain page, outside the npm workspaces, and until now named
  # by no job here at all. What it *does* is checked by `src/enroll-app-cli-contract.test.ts`, which
  # reads both ends of the CLI contract statically and runs inside `npm test` — no toolchain needed.
  #
  # This job checks the two things a static read cannot: that `Cargo.lock` still describes
  # `Cargo.toml`, and that the source is formatted. **No `clippy` and no build**, deliberately —
  # compiling tauri on Linux pulls in webkit2gtk system packages and several minutes, and the defect
  # class that would catch (a type error in 276 lines that the author never compiled) is not one
  # this app has had. When it grows a real build, this is where it goes.
  enroll-app:
    name: enrolment app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--locked` is the whole point: it resolves the manifest and **fails if the lockfile would
      # have to change**. A tracked lock that has drifted from its manifest is worse than no lock,
      # because it looks like a pin while `cargo build` quietly resolves something else.
      - name: Cargo.lock still describes Cargo.toml
        working-directory: packages/enroll-app/src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: rustfmt
        working-directory: packages/enroll-app/src-tauri
        run: cargo fmt --check

  # **The policy layer does not belong to this repository.** Credential scanning, workflow
  # auditing and dependency review ask the same question of all five repositories, whatever
  # each one builds. Kept as copies they drift, and once they drift nothing says which one
  # is the standard.
  #
  # A reusable workflow runs in the **caller's** context — the checkout is this repository
  # and `.gitleaks.toml` is this repository's. Each keeps its own allowlist with its reasons.
  #
  # ⚠️ Pinned by commit SHA. At `@main`, one line over there changes this gate.
  #    Dependabot updates this SHA.
  policy:
    uses: henryj-dev/.github/.github/workflows/policy-checks.yml@f8eab7393216bd0054e6b65297a0cc5baa865630
    permissions:
      contents: read
      # dependency-review says inside the pull request what was blocked and why.
      pull-requests: write
    secrets:
      # A licence is required for organisation-owned repositories. It is an org secret.
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # The one check name the branch ruleset requires.
  #
  # Listing job names one by one means that the day a name changes, that required check
  # becomes a check that does not exist — and the protection quietly disappears. GitHub
  # says nothing when it happens. Collecting them here makes adding or removing a job a
  # one-line change to `needs:`, and leaves the ruleset alone.
  gate:
    name: gate
    needs: [check, e2e, rollback, leaks, guards, enroll-app, policy]
    # This job must run even when something upstream is red. Otherwise it is a check that
    # never reported, the rule waits forever, and nothing records what broke.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every upstream job settled green
        # Never interpolate `${{ }}` into a `run:` body: it is substituted before the
        # shell reads the script, so a quote or a `$(...)` in the value becomes shell code.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          # `skipped` passes: some jobs do not apply to this event (dependency review only
          # means something on a pull request). Skipped and failed are different words.
          bad="$(jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length' <<<"$NEEDS")"
          test "$bad" = "0" || { echo "::error::$bad upstream job(s) did not pass"; exit 1; }
          echo "gate passed"
