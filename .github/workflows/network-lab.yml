name: isolated network lab
on:
  pull_request:
    paths:
      - 'src/network-*.ts'
      - 'examples/network-lab.ts'
      - 'scripts/network-lab/**'
      - '.github/workflows/network-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    name: FRR ${{ matrix.frr }} packet forwarding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        frr: ['8.5.6', '10.2.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: isolated compiler and kernel lab
        env:
          FRR_VERSION: ${{ matrix.frr }}
        run: scripts/network-lab/run.sh "$FRR_VERSION"
