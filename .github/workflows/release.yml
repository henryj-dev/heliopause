# Publishing to npm, on a GitHub release and never on a push.
#
# ## Why this exists before there is anything to publish
#
# `version` is `0.0.0` and the README says "Early. Pin exact versions", so nothing will run this for
# a while. It is here anyway because the first publish is the one most likely to go wrong, and the
# alternative to a reviewed file is somebody running `npm publish` from a laptop at the moment they
# decide to ship — from a tree with `policy/` and `docs/` symlinked in, holding the PKI directories
# this repository takes such care to keep out of git.
#
# **That is the actual risk this file addresses.** Not convenience: the `files` list in package.json
# is what decides the tarball, and a local publish is the one place nothing checks it.
#
# ## It cannot run until someone configures it, and that is deliberate
#
# There is no `NPM_TOKEN` on this repository. Without one the publish step fails, loudly, at the
# end of a run that has already done every check — which is the right shape for a step that has
# never been exercised. To enable it:
#
#   1. Create an npm **granular access token** scoped to this package only, with publish rights and
#      no other permission. A classic automation token can publish anything the account can.
#   2. Add it as the repository secret `NPM_TOKEN`.
#   3. Set the real version in package.json and open a GitHub release whose tag is `v<version>`.
#
# ## Trigger
#
# `release: [published]` only. Not a tag push: a tag can be moved, and a tag pushed by mistake is a
# publish that cannot be taken back — npm unpublish has a 72-hour window and leaves the version
# permanently burned. A GitHub release is a deliberate act with a human behind it.
name: release

on:
  release:
    types: [published]
  # Everything except the publish, on demand. This is how you find out whether the tarball is right
  # *before* the version is spent, and it is the only way to exercise this file at 0.0.0.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false          # never cancel a publish mid-flight

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Past this point nothing can be taken back — a published version stays published.
    # The environment is where the approval and the deployment record live, and it is
    # what narrows `NPM_TOKEN` to this job instead of to every workflow in the repository.
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ github.event.repository.name }}
    permissions:
      contents: read
      # npm provenance: the registry records which workflow, at which commit, built the tarball, and
      # anyone can verify it without trusting us. This is the whole reason to publish from CI rather
      # than a laptop.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 🔴 **No cache here, unlike every other workflow, and it is turned off explicitly.**
      #
      # zizmor flagged `cache: npm` on this job and it is right: the Actions cache is writable by any
      # workflow run on this repository, so a job that restores from it and then publishes is a path
      # from "someone poisoned a cache entry" to "that content is on the registry under our name".
      # Caching saves seconds; this job runs rarely and produces something permanent.
      #
      # Dropping the input is not enough on setup-node v7. `package-manager-cache` defaults to true
      # and turns caching on by itself when package.json declares a `packageManager` (or
      # `devEngines.packageManager`). This one does not today — so the protection would be a field
      # nobody remembers, in a different file, whose addition is an ordinary thing to do. Said here
      # instead, where the reason is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The published package is `src/` run directly — there is no build, so what CI checked is
      # byte-for-byte what ships. Re-run the gates here anyway: `ci` passed on a commit, and a
      # release can point at a different one.
      - run: npm run typecheck
      - run: npm test
      - run: python3 agent/test_validate.py && python3 agent/test_enroll.py

      # 🔴 The check that matters most, and the one a laptop publish never does.
      #
      # This repository is developed with `policy/`, `docs/` and the PKI directories present — as
      # untracked files or as symlinks into another checkout. `npm pack` honours `.npmignore` and
      # the `files` list, but a mistake there is invisible until the tarball is public, and by then
      # a site inventory has been published to a CDN that mirrors forever.
      #
      # So: list the tarball and refuse on anything that is not meant to ship.
      - name: the tarball carries nothing site-specific
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          # A heredoc rather than `node -e '…'`: the script is single-quoted JavaScript either way,
          # and this keeps the shell out of it entirely instead of arguing with shellcheck about
          # expansions that must not happen.
          node <<'JS'
          const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
          const forbidden = files.filter((f) =>
            /^(policy|docs|pki|pki-prod|pki-signing|pki-util|artifacts|snapshots)\//.test(f) ||
            /\.(key|pem|csr|p12|pfx|jks|keystore|der|p8|pk8)$/.test(f) ||
            /(^|\/)observe(-peers)?\.(log|targets)$/.test(f));
          if (forbidden.length) {
            console.error("refusing to publish — the tarball holds:");
            for (const f of forbidden) console.error("  " + f);
            process.exit(1);
          }
          console.log(`tarball: ${files.length} files, none site-specific`);
          for (const f of files) console.log("  " + f);
          JS

      # The tag must name the version being published. A release tagged `v0.3.0` that publishes
      # 0.2.9 is a mismatch nobody notices until someone installs the wrong thing.
      - name: the tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$TAG" = "v$version" \
            || { echo "release tag $TAG does not match package version $version"; exit 1; }

      - name: publish
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--provenance` is what makes the registry record the workflow and commit that produced
        # this tarball. `--access public` because a scoped-looking name defaults to restricted.
        run: npm publish --provenance --access public
