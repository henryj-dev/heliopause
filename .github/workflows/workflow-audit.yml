# CI for CI. The workflows in this directory are the least-tested code in the repository, and the
# two most expensive defects they have carried were both invisible until something else went wrong.
#
#   - `runs-on: ${{ env.RUNNER }}` — evaluated before a job's environment exists, so it resolved to
#     empty and landed **every job on the self-hosted runner** while reading as if it did the
#     opposite. Nothing failed. actionlint rejects an `env` context in `runs-on` outright.
#   - `sparse-checkout` quietly switched the trusted gate's clone to `--filter=blob:none`, and a
#     blobless clone has no blobs to scan. The gate passed for as long as it existed while reading
#     nothing at all — a green that meant the opposite of green.
#
# Neither would have been caught by a test, because there is no test; a workflow's only feedback is
# whether the run went green, and both of these went green. That is the argument for this file: two
# linters that read the workflow as text and answer questions the run cannot.
#
# ## The two, and why both
#
# **actionlint** checks that the workflow is a valid workflow — expression syntax, context
# availability, action input names, `runs-on` labels — and runs shellcheck over every `run:` block,
# which is otherwise unreviewed shell that executes with the job's token.
#
# **zizmor** asks the security question instead: which of these steps can be made to run code or
# leak a credential. This repository has one `pull_request_target` workflow guarding published site
# data, and that is the trigger zizmor exists to reason about.
#
# ## Pinned binaries, not actions
#
# Both are pinned by version *and* SHA-256, the way `gitleaks` is in `ci.yml` and for the same
# reason: an action is pinned by commit SHA, a downloaded release has no such handle, and an
# unpinned release URL is a supply chain that changes under you. Using the upstream Actions instead
# would mean adding two more third-party actions to a repository that audits its own workflows for
# exactly that.
#
# Note what this costs: dependabot updates the SHA-pinned actions, and it does **not** update these
# two. The version and checksum below are updated by hand, deliberately, and are the one thing here
# that will go stale quietly. `dependabot.yml` says the same from the other side.
name: workflow audit

on:
  push:
    branches: [main]
  # No `paths:` filter. It is the obvious optimisation — the job only reads `.github/workflows` —
  # and it is the one that turns a check into a trap: a filtered workflow never *starts* on an
  # unrelated pull request, and a required check that never starts sits pending forever rather than
  # passing. The whole job is under a minute; that is cheaper than the failure mode.
  pull_request:
  schedule:
    # A workflow that has not changed can still start failing: a deprecated action input, a runner
    # image that drops a label, a new audit in either tool. Weekly is when that becomes visible.
    - cron: "23 7 * * 4"

permissions:
  contents: read

jobs:
  audit:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # shellcheck is preinstalled on the hosted Ubuntu image, and actionlint uses it when it is on
      # PATH. Verified against the current tree: clean apart from one deliberate `ls` in the trusted
      # gate, which carries a `# shellcheck disable=SC2012` and the reason it is safe there.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

      # `--persona=regular` is the default and is named here because the choice matters: `pedantic`
      # adds stylistic findings and `auditor` adds low-confidence ones, and a linter that cries on
      # every run is one somebody adds `continue-on-error` to.
      #
      # Offline by default — no network audits, so no token and nothing sent anywhere. Findings are
      # about the workflow text, which is public in this repository anyway.
      #
      # Suppressions live inline as `# zizmor: ignore[rule]` next to what they excuse, with the
      # reason. There is no repository-wide ignore file on purpose: a rule turned off in a config
      # nobody opens is off for code that has not been written yet.
      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
          ZIZMOR_SHA256: "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839"
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o /tmp/zizmor.tgz "$url"
          echo "${ZIZMOR_SHA256}  /tmp/zizmor.tgz" | sha256sum -c -
          tar xzf /tmp/zizmor.tgz -C /tmp
          /tmp/zizmor --no-progress --persona=regular .github/workflows
