# Why a repository that pins everything by SHA needs this most, not least.
#
# Every action in `.github/workflows` is pinned to a commit SHA, and the gitleaks and actionlint
# binaries are pinned to a version *and* a checksum. That is the right call — a floating tag is a
# supply chain that changes under you — but it has a cost that is easy to forget: a SHA never
# updates itself, and nothing about a stale one is visible. A pinned action with a fixed
# vulnerability looks exactly like a pinned action that is current.
#
# So the pinning and this file are two halves of one policy. The pin decides that an update is a
# reviewed change; this decides that the update is actually proposed.
version: 2
updates:
  # ── GitHub Actions ─────────────────────────────────────────────────────────
  #
  # Dependabot rewrites the SHA and the trailing `# vX.Y.Z` comment together, so the pin stays a pin
  # and the version stays readable. It does not touch the two pinned binaries downloaded with
  # `curl` — those are checksum-verified by hand, and the checksum is the thing a reviewer has to
  # regenerate deliberately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One pull request for all of them. Actions here move in step (checkout and setup-node ship
    # together), and four near-identical pull requests a month is how a small project starts
    # rubber-stamping them.
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    labels: [dependencies]

  # ── npm ────────────────────────────────────────────────────────────────────
  #
  # `directory: /` covers all seven workspaces: they have no lockfile of their own, the root
  # `package-lock.json` is the whole dependency set, and dependabot reads workspaces from the root
  # manifest.
  #
  # The runtime dependency count of the library is zero by design — the relay and the agent import
  # only `src/`, which is why the `rollback` job needs no `npm ci`. Everything below is therefore
  # build- and console-side: typescript, svelte, vite, lucide-static.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Split by blast radius rather than by name. A dev-tooling bump that breaks something breaks
      # CI, loudly and immediately; a console dependency ships to the page an operator opens when
      # the network is broken. Reviewing those in one diff means reviewing them at the lower
      # standard.
      #
      # **Majors are excluded from both groups** — they arrive as their own pull request. Measured
      # on the first batch this config ever produced: `dev-tooling` came back holding
      # `@types/node` 22→26, `typescript` 5→7 *and* a routine `lucide-static` 1.31→1.33 in one
      # diff. Two of those are the kind of change that needs its own argument; the third is a
      # rubber stamp. Grouped, the only ways to act were "take all three" or "take none", and the
      # safe one throws away a fix for no reason. `update-types` is what keeps a major from
      # hiding behind a patch.
      dev-tooling:
        dependency-type: development
        patterns: ["typescript", "@types/*", "lucide-static"]
        update-types: [minor, patch]
      console:
        patterns: ["svelte*", "@sveltejs/*", "vite"]
        update-types: [minor, patch]
    ignore:
      # `@types/node` is not a dependency in the ordinary sense — it is the declaration of which
      # Node this code is written against, and that answer is fixed elsewhere: `node-version: "22"`
      # in CI, and the type-stripping contract that makes the runtime version part of the API
      # rather than an implementation detail (CONTRIBUTING).
      #
      # Taking the 26 types while shipping to 22 hosts is the repository's own stated failure mode
      # turned on the toolchain: `tsc` would start accepting calls the target runtime does not have,
      # and it would accept them *silently* — a green typecheck that certifies the wrong platform.
      # So the majors are ignored here rather than reviewed each time. **When the Node floor moves,
      # this line is what has to move with it**, together with `node-version` in `ci.yml` and the
      # `^22` range in package.json.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 — the native port. Held, and the reason is upstream rather than us.
      #
      # This decision was first recorded only in dependabot's own ignore state, set from a pull
      # request comment. That is invisible: nothing in the repository said 7.x was being withheld or
      # why, and the next person would rediscover it by wondering where the pull requests went. A
      # decision that shapes the toolchain belongs in a file that a diff can show.
      #
      # Measured 2026-08-23, against this tree: `tsc --noEmit` under 7.0.2 is **clean**, and 7.0.2
      # still rejects all six planted defects that were used to accept 6.x (string to number, a
      # possibly-undefined index, a missing property, a short call, an unnarrowed union, an optional
      # dereference). So the compiler is not the problem.
      #
      # `svelte-check` is. It refuses to run under 7 and says what it needs: *"TypeScript 7 support
      # currently requires both TypeScript 7 and TypeScript 6 installed in your project, and requires
      # using the --tsgo flag"* — i.e. `typescript@~6` plus `@typescript/native@npm:typescript@7`.
      # Taking 7 today therefore means carrying two compilers so that the console check can use a
      # flagged path, while `npm run typecheck` goes on using 6. That is not a migration to 7; it is
      # a second compiler bought for nothing, since 6 and 7 reject the same things here.
      #
      # **Revisit when svelte-check runs on 7 alone.** Then this block comes out and the bump is an
      # ordinary major with its own pull request.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]

  # ── Cargo (packages/enroll-app) ────────────────────────────────────────────
  #
  # 🔴 The desktop enrolment app was in **no** update ecosystem at all: not npm (it is deliberately
  # outside `workspaces`, see the note there), not cargo, not anything. Its dependency tree is
  # tauri + serde and it is the tool an operator uses to sign host certificates with the local CA —
  # the one place in this repository where a supply-chain problem reaches a signing key.
  #
  # `directory` names the crate, not the repository root: `Cargo.toml` and `Cargo.lock` live under
  # `src-tauri/`, and dependabot resolves the manifest relative to this path.
  - package-ecosystem: cargo
    directory: /packages/enroll-app/src-tauri
    schedule:
      interval: monthly
    groups:
      # Tauri's crates move together and a partial bump does not build.
      tauri:
        patterns: ["tauri", "tauri-*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]

  # ── npm, packages/enroll-app ───────────────────────────────────────────────
  #
  # Listed separately because the app is **not** a workspace of the root manifest — the `directory:
  # /` entry above therefore does not reach it, and its `package-lock.json` is its own.
  - package-ecosystem: npm
    directory: /packages/enroll-app
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]

# Not configured here, deliberately: `pip`. The agent is standard library only — that is a stated
# property (`agent/` installs nothing, which is why a host needs no package index reachable), not an
# omission waiting to be fixed. If a requirements file ever appears, that property is gone and this
# file is the second thing to change.

# ── What this file does NOT control: security updates ──────────────────────────
#
# Everything above is *version* updates — the scheduled sweep for newer releases. Dependabot's other
# half, the one that opens a pull request the day an advisory lands, is a repository setting
# ("Dependabot security updates"), and no line here turns it on or off. It was **off** while this
# file existed and looked complete, which is the failure mode worth naming: the schedules above make
# the repository look covered, and a monthly sweep is the wrong response time for a published
# advisory. Turned on 2026-08-23; `gh api repos/<owner>/<repo>/automated-security-fixes` says which
# it is now.
#
# A security update ignores the groups above and arrives alone, immediately. It does respect
# `ignore` — so the `@types/node` major rule is a standing decision that an advisory cannot
# override, which is correct for a package that is really a platform declaration, and is the kind
# of thing to re-read if a Node types advisory ever appears.
